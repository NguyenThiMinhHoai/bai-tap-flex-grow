
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Thực hành Flex Grow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Thực hành thuộc tính flex-grow</h1>
    <p>Flex Item số 2 có flex-grow: 4,
       các item còn lại có flex-grow: 1.</p>

    <div class="container">
        <div class="item">1</div>
        <div class="item item-2">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
    </div>

    <p>
        Kết quả: Item số 2 chiếm nhiều
        không gian hơn các item còn lại.
    </p>
</body>
</html>
